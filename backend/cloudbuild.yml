steps:
  - name: 'gcr.io/cloud-builders/docker'
    args: ['build', '-t', 'gcr.io/$PROJECT_ID/hsl-weather-backend', './backend']

  - name: 'gcr.io/cloud-builders/docker'
    args: ['push', 'gcr.io/$PROJECT_ID/hsl-weather-backend']

  - name: 'gcr.io/cloud-builders/gcloud'
    args:
      - 'run'
      - 'deploy'
      - 'hsl-weather-backend'
      - '--image=gcr.io/$PROJECT_ID/hsl-weather-backend'
      - '--region=europe-north1'
      - '--platform=managed'
      - '--allow-unauthenticated'
      - '--set-env-vars=WEATHER_API_KEY=${_WEATHER_API_KEY}'

substitutions:
  _WEATHER_API_KEY: ''
